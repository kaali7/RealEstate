{% load static %}
<nav class="site-nav">
  <div class="container">
    <a class="brand" href="{% url 'index' %}">
      <img src="{% static 'img/logo.png' %}" alt="">
      <span>Gekay <span class="brand-mark">Estates</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle>Menu</button>
    <ul class="nav-links" data-nav-menu>
      <li><a {% if '/' == request.path %}class="active"{% endif %} href="{% url 'index' %}">Home</a></li>
      <li><a {% if 'about' in request.path %}class="active"{% endif %} href="{% url 'about' %}">Our approach</a></li>
      <li><a {% if 'listings' in request.path %}class="active"{% endif %} href="{% url 'listings' %}">Browse homes</a></li>
      <li>
        {% if user.is_authenticated %}
          <a class="nav-cta" href="{% url 'dashboard' %}">Dashboard</a>
        {% else %}
          <a class="nav-cta" href="{% url 'login' %}">Sign in</a>
        {% endif %}
      </li>
    </ul>
    {% if user.is_authenticated %}
      <form action="{% url 'logout' %}" method="POST" id="logout">
        {% csrf_token %}
        <button class="nav-logout" type="submit">Log out</button>
      </form>
    {% endif %}
  </div>
</nav>
